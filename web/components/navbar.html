<!-- =========================================
     全站统一顶部导航栏
     文件：/navbar.html
========================================= -->
<header class="site-navbar">
  <!-- 左侧：可横向滚动的页面导航 -->
  <div class="navbar-scroll">
    <nav class="navbar-links">
      <a href="/">
        <span>首页</span>
        <small>Home</small>
      </a>
      <a href="/submit">
        <span>投稿</span>
        <small>Submit</small>
      </a>
      <a href="/archive">
        <span>往期</span>
        <small>Archive</small>
      </a>
      <a href="/help">
        <span>帮助</span>
        <small>Help</small>
      </a>
      <a href="/settings">
        <span>设置</span>
        <small>Settings</small>
      </a>
      <a href="/url">
        <span>友情链接</span>
        <small>Links</small>
      </a>
    </nav>
  </div>
  <!-- 右侧：登录状态
       这个区域不会跟随左侧导航横向滚动 -->
  <div class="navbar-account">
    <a href="/login" class="account-button">
      <span class="account-icon">♙</span>
      <span class="account-text">
        <span class="account-name">登录</span>
        <small>Login</small>
      </span>
    </a>
  </div>
</header>
<style>
/* =========================================
   顶部导航整体
========================================= */
.site-navbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  width: 100%;
  height: 64px;
  display: flex;
  align-items: center;
  z-index: 9999;
  box-sizing: border-box;
  /*
    不使用纯白背景。
    让导航和网站背景融合。
  */
  background: rgba(20, 20, 25, 0.72);
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  border-bottom: 1px solid rgba(255,255,255,0.18);
  box-shadow:
    0 4px 24px rgba(0,0,0,0.18);
}
/* =========================================
   左侧导航滚动区域
========================================= */
.navbar-scroll {
  flex: 1;
  min-width: 0;
  height: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
  /*
    防止 iPhone 横向滑动时出现奇怪的回弹
  */
  -webkit-overflow-scrolling: touch;
  /*
    左右留一点空间
  */
  padding-left: 8px;
  padding-right: 8px;
  box-sizing: border-box;
}
.navbar-scroll::-webkit-scrollbar {
  display: none;
}
/* =========================================
   导航链接排列
========================================= */
.navbar-links {
  height: 100%;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
}
/* =========================================
   单个导航按钮
========================================= */
.navbar-links a {
  flex-shrink: 0;
  display: flex;
  align-items: baseline;
  gap: 5px;
  padding: 8px 15px;
  border-radius: 15px;
  text-decoration: none;
  color: #fff;
  background: rgba(255,255,255,0.18);
  border: 1px solid rgba(255,255,255,0.14);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  box-shadow:
    0 3px 12px rgba(0,0,0,0.12);
  transition:
    background 0.2s ease,
    transform 0.2s ease;
}
/* 中文 */
.navbar-links a span {
  font-size: 17px;
  font-weight: 600;
}
/* 英文 */
.navbar-links a small {
  font-size: 9px;
  opacity: 0.6;
  letter-spacing: 0.3px;
}
/* 点击 */
.navbar-links a:active {
  transform: scale(0.95);
  background: rgba(255,255,255,0.28);
}
/* =========================================
   右侧账号区域
========================================= */
.navbar-account {
  /*
    关键：
    右侧区域不会进入 navbar-scroll，
    因此左边怎么滑，
    这里都不会动。
  */
  flex-shrink: 0;
  height: 100%;
  display: flex;
  align-items: center;
  padding: 0 10px 0 6px;
  box-sizing: border-box;
  /*
    给它一个稍微明显的分隔
  */
  border-left:
    1px solid rgba(255,255,255,0.18);
  background:
    rgba(15,15,20,0.22);
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
}
/* =========================================
   登录按钮
========================================= */
.account-button {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 7px 12px;
  border-radius: 15px;
  color: #fff;
  text-decoration: none;
  background:
    rgba(255,255,255,0.18);
  border:
    1px solid rgba(255,255,255,0.15);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  box-shadow:
    0 3px 12px rgba(0,0,0,0.12);
}
/* 用户图标 */
.account-icon {
  font-size: 20px;
  line-height: 1;
}
/* 账号文字 */
.account-text {
  display: flex;
  flex-direction: column;
  line-height: 1.05;
}
/* 用户名 */
.account-name {
  font-size: 15px;
  font-weight: 600;
}
/* Login */
.account-text small {
  font-size: 8px;
  opacity: 0.6;
  letter-spacing: 0.3px;
}
/* =========================================
   手机端
========================================= */
@media (max-width: 600px) {
  .site-navbar {
    height: 58px;
  }
  .navbar-links a {
    padding:
      7px 12px;
    border-radius: 14px;
  }
  .navbar-links a span {
    font-size: 15px;
  }
  .navbar-links a small {
    font-size: 8px;
  }
  .navbar-account {
    padding-left: 5px;
    padding-right: 7px;
  }
  .account-button {
    padding:
      7px 9px;
    border-radius: 14px;
  }
  .account-icon {
    font-size: 18px;
  }
  .account-name {
    font-size: 14px;
  }
}
/* =========================================
   超小屏幕
========================================= */
@media (max-width: 380px) {
  .account-text small {
    display: none;
  }
  .account-button {
    padding:
      7px 8px;
  }
}
</style>
