<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>设置</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body class="light-mode">

  <!-- 顶部横向导航条（全站统一） -->
  <div class="topbar">
    <a href="/">首页</a>
    <a href="/submit">投稿</a>
    <a href="/archive">往期</a>
    <a href="/help">帮助</a>
    <a href="/settings">设置</a>
    <a href="/url">友情链接</a>
  </div>

  <!-- 主体内容（不使用滚动动画） -->
  <main style="padding: 20px;">

    <div class="glass-card">

      <h1>设置</h1>

      <div class="glass-card" style="margin-top:20px;">
        <h2>模式</h2>

        <div class="theme-switch">
          <button onclick="setLightMode()">浅色模式</button>
          <button onclick="setDarkMode()">深色模式</button>
        </div>
      </div>

    </div>

  </main>

  <!-- 深色模式 -->
  <script>
    function setLightMode() {
      document.body.classList.remove("dark-mode");
      document.body.classList.add("light-mode");
      localStorage.setItem("theme", "light");
    }

    function setDarkMode() {
      document.body.classList.remove("light-mode");
      document.body.classList.add("dark-mode");
      localStorage.setItem("theme", "dark");
    }

    window.onload = function() {
      const savedTheme = localStorage.getItem("theme");
      if (savedTheme === "dark") {
        document.body.classList.add("dark-mode");
      } else {
        document.body.classList.add("light-mode");
      }
    }
  </script>
<div class="glass-card" style="margin-top:20px;">
  <h2>关于本站</h2>

  <div class="footer-info">
    <div class="footer-line">
      <span class="footer-label">Version:</span>
      <span class="footer-value">1.3.178</span>
    </div>

    <div class="footer-line">
      <span class="footer-label"></span>
      <span class="footer-value">© 2016-2026 Broadcast Club of SHS,All Rights Reserved.</span>
    </div>

    <div class="footer-line">
      <span class="footer-label">Updated at:</span>
      <span class="footer-value">2026-08-26</span>
    </div>
  </div>
</div>


</body>
</html>
