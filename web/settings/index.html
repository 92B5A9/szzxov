<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#dfe7ef">
  <title>设置丨苏州中学OV广播社</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .site-version,.changelog-version{font-size:1.15em;font-weight:700;line-height:1.4}
    .site-updated,.changelog-date{display:block;margin-top:4px;opacity:.7;font-size:.9em}
    .changelog-release{padding:14px 0;border-bottom:1px solid #8884}
    .changelog-release:last-child{border-bottom:0}
    .changelog-items{margin:10px 0 0 1.2em;padding:0;line-height:1.8}
  </style>
</head>
<body class="light-mode">
  <div id="site-nav"></div>
  <main style="padding:20px;">
    <div class="glass-card">
      <h1>设置</h1>
      <div class="glass-card" style="margin-top:20px;">
        <h2>模式</h2>
        <div class="theme-switch">
          <button type="button" onclick="setLightMode()">浅色模式</button>
          <button type="button" onclick="setDarkMode()">深色模式</button>
        </div>
      </div>
      <div class="glass-card" style="margin-top:20px;">
        <h2>关于本站</h2>
        <div class="footer-info">
          <div class="site-version" id="site-version">正在读取…</div>
          <div class="site-updated" id="site-updated"></div>
          <div class="footer-line"><span class="footer-value">© 2016-2026 Broadcast Club of SHS,All Rights Reserved.</span></div>
        </div>
      </div>
      <div class="glass-card" style="margin-top:20px;">
        <h2>更新说明</h2>
        <div id="changelog-list" class="changelog-list">正在读取更新说明…</div>
      </div>
    </div>
  </main>
  <script src="/js/config.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/changelog.js?v=20261101"></script>
</body>
</html>
