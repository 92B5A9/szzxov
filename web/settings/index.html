<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#dfe7ef">
  <title>设置丨苏州中学OV广播社</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="light-mode">
  <div id="site-nav"></div>
  <main style="padding:20px;">
    <div class="glass-card">
      <h1>设置</h1>
      <div class="glass-card" style="margin-top:20px;">
        <h2>模式</h2>
        <div class="theme-switch">
          <button type="button" onclick="setLightMode()">浅色模式</button>
          <button type="button" onclick="setDarkMode()">深色模式</button>
        </div>
      </div>
      <div class="glass-card" style="margin-top:20px;">
        <h2>关于本站</h2>
        <div class="footer-info">
          <div class="footer-line"><span class="footer-label">Version:</span><span class="footer-value">2.2.281</span></div>
          <div class="footer-line"><span class="footer-label"></span><span class="footer-value">© 2016-2026 Broadcast Club of SHS,All Rights Reserved.</span></div>
          <div class="footer-line"><span class="footer-label">Updated at:</span><span class="footer-value">2026-11-01</span></div>
        </div>
      </div>
      <div class="glass-card" style="margin-top:20px;">
        <h2>更新说明</h2>
        <div class="footer-info">
         <div class="footer-line"><span class="footer-label">2.2.281</span><span class="footer-value">2026-11-01</span></div>
         <ul style="margin:8px 0 0 1.2em;line-height:1.8;">
           <li>版本号更新及修复部分错误。</li>
          </ul>
        </div>
        <div class="footer-info">
          <div class="footer-line"><span class="footer-label">2.2.270</span><span class="footer-value">2026-11-01</span></div>
          <ul style="margin:8px 0 0 1.2em;line-height:1.8;">
            <li>音乐档案馆新增月份与日期分组折叠功能。</li>
            <li>优化档案浏览结构，默认展开最新月份和最新日期。</li>
            <li>设置页面新增更新说明与版本记录。</li>
          </ul>
        </div>
      </div>
    </div>
  </main>
  <script src="/js/config.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/theme.js"></script>
</body>
</html>
