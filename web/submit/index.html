<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#dfe7ef">
  <title>投稿丨苏州中学OV广播社</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="light-mode">
  <div id="site-nav"></div>
  <main style="padding:20px;">
    <div class="glass-card">
      <h1>提交投稿</h1>
      <form id="submitForm" style="margin-top:20px;">
        <label class="form-label" for="title">歌曲名</label>
        <input type="text" id="title" name="title" class="input-glass" placeholder="请输入歌曲名" required>
        <label class="form-label" for="author">歌手</label>
        <input type="text" id="author" name="author" class="input-glass" placeholder="请输入歌手" required>
        <label class="form-label" for="issue">期数</label>
        <input type="number" id="issue" name="issue" class="input-glass" placeholder="请输入期数" min="1" required>
        <button type="submit" class="submit-btn" id="submitButton">提交</button>
      </form>
      <p id="result"></p>
    </div>
  </main>
  <script src="/js/config.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/submit.js"></script>
</body>
</html>
