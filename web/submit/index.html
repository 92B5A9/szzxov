<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>投稿丨苏州中学OV广播社</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="light-mode">
  <!-- 顶部横向导航条（全站统一） -->
  <div class="topbar">
    <a href="/">首页</a>
    <a href="/submit">投稿</a>
    <a href="/archive">往期</a>
    <a href="/help">帮助</a>
    <a href="/settings">设置</a>
    <a href="/url">友情链接</a>
  </div>
  <!-- 主体内容 -->
  <main style="padding: 20px;">
    <div class="glass-card">
      <h1>提交投稿</h1>
      <form id="submitForm" style="margin-top:20px;">
        <label class="form-label">歌曲名</label>
        <input
          type="text"
          name="title"
          class="submit-input input-glass"
          placeholder="请输入歌曲名"
          required
        >
        <label class="form-label">歌手</label>
        <input
          type="text"
          name="author"
          class="submit-input input-glass"
          placeholder="请输入歌手"
          required
        >
        <label class="form-label">期数</label>
        <input
          type="number"
          name="issue"
          class="submit-input input-glass"
          placeholder="请输入期数"
          min="1"
          required
        >
        <button type="submit" class="submit-btn" id="submitButton">
          提交
        </button>
      </form>
      <p id="result"></p>
    </div>
  </main>
  <!-- 投稿提交逻辑 -->
  <script>
    console.log("投稿页 JS 已加载");
    const form = document.getElementById("submitForm");
    const resultText = document.getElementById("result");
    const submitButton = document.getElementById("submitButton");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const title = e.target.title.value.trim();
      const author = e.target.author.value.trim();
      const issue = Number(e.target.issue.value);
      if (!title || !author || !issue) {
        resultText.innerText = "请完整填写投稿信息。";
        return;
      }
      submitButton.disabled = true;
      submitButton.innerText = "提交中...";
      resultText.innerText = "";
      try {
        const res = await fetch("https://api.szzxov.com/api/submit", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            title: title,
            author: author,
            issue: issue
          })
        });
        const result = await res.json();
        if (res.ok && result.ok) {
          resultText.innerText = "投稿已提交！感谢你的投稿。";
          form.reset();
        } else {
          resultText.innerText =
            result.message || "提交失败，请稍后再试。";
        }
      } catch (error) {
        console.error("投稿请求失败：", error);
        resultText.innerText =
          "无法连接服务器，请检查网络后重试。";
      }
      submitButton.disabled = false;
      submitButton.innerText = "提交";
    });
  </script>
  <!-- 深色模式 -->
  <script>
    function setLightMode() {
      document.body.classList.remove("dark-mode");
      document.body.classList.add("light-mode");
      localStorage.setItem("theme", "light");
    }
    function setDarkMode() {
      document.body.classList.remove("light-mode");
      document.body.classList.add("dark-mode");
      localStorage.setItem("theme", "dark");
    }
    window.onload = function() {
      const savedTheme = localStorage.getItem("theme");
      if (savedTheme === "dark") {
        document.body.classList.remove("light-mode");
        document.body.classList.add("dark-mode");
      } else {
        document.body.classList.remove("dark-mode");
        document.body.classList.add("light-mode");
      }
    };
  </script>
</body>
</html>
