<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#dfe7ef">
  <title>登录丨苏州中学OV广播社</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="light-mode">
  <div id="site-nav"></div>
  <main style="padding:20px;">
    <div class="glass-card">
      <h1>登录</h1>
      <form id="loginForm" style="margin-top:20px;">
        <label class="form-label" for="username">用户名</label>
        <input type="text" id="username" class="input-glass" placeholder="请输入用户名" autocomplete="username" required>
        <label class="form-label" for="password">密码</label>
        <input type="password" id="password" class="input-glass" placeholder="请输入密码" autocomplete="current-password" required>
        <button type="submit" class="submit-btn" id="loginButton">登录</button>
      </form>
      <p id="result"></p>
      <p>还没有账号？ <a href="/register/">立即注册</a></p>
    </div>
  </main>
  <script src="/js/config.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
