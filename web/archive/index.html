<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#dfe7ef">
  <title>音乐档案馆丨苏州中学OV广播社</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .archive-page{max-width:1100px;margin:0 auto;padding:20px}
    .archive-panel{padding:20px;border:1px solid #8885;border-radius:18px;margin:14px 0}
    .archive-filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-top:16px}
    .archive-filters input,.archive-filters select{box-sizing:border-box;width:100%;min-width:0;padding:12px}
    .archive-meta{opacity:.72;font-size:.9em}
    .archive-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px;margin-top:16px}
    .archive-playlist{padding:16px;border:1px solid #8885;border-radius:15px}
    .archive-playlist h3{margin:0 0 8px}
    .archive-playlist summary{cursor:pointer;list-style:none}
    .archive-playlist summary::-webkit-details-marker{display:none}
    .archive-song-list{padding-left:22px;margin:14px 0 0}
    .archive-song-list li{padding:7px 0;border-bottom:1px solid #8883}
    .archive-song-artist{display:block;opacity:.7;font-size:.9em;margin-top:2px}
    .archive-empty{padding:24px;text-align:center;opacity:.75}
.archive-month-group{margin-top:24px}
.archive-month-heading{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:1.35rem;margin:0 0 18px;padding:0 0 10px;border-bottom:1px solid #8885;list-style:none}
.archive-month-heading::-webkit-details-marker,.archive-date-heading::-webkit-details-marker{display:none}
.archive-month-heading::before,.archive-date-heading::before{content:"▸";display:inline-block;transition:transform .18s;opacity:.65}
.archive-month-group[open]>.archive-month-heading::before,.archive-date-group[open]>.archive-date-heading::before{transform:rotate(90deg)}
.archive-date-group{margin:18px 0 26px}
.archive-date-heading{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:1.05rem;margin:0 0 10px;opacity:.88;list-style:none}
.archive-playlist-link{display:block;color:inherit;text-decoration:none;transition:transform .18s,border-color .18s}
.archive-playlist-link:hover{transform:translateY(-2px);border-color:currentColor}
.archive-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.archive-card-arrow{opacity:.55}
.archive-song-count{margin-top:12px;font-size:.9em;opacity:.75}
    @media(max-width:650px){.archive-page{padding:12px}.archive-panel{padding:14px}.archive-filters{grid-template-columns:1fr}}
  </style>
</head>
<body class="light-mode">
  <div id="site-nav"></div>
  <main class="archive-page">
    <section class="archive-panel">
      <p class="archive-meta">OUR VOICE · MUSIC ARCHIVE</p>
      <h1>音乐档案馆</h1>
      <p class="archive-meta">歌单标题将自动归入对应月份与时段。选择一个或多个条件，浏览广播社往期歌单。</p>
      <div id="archive-stats" class="archive-meta" aria-live="polite">正在读取档案……</div>
      <div class="archive-filters">
        <input type="search" id="search" placeholder="搜索歌单、歌曲名或歌手" aria-label="搜索歌单、歌曲名或歌手">
        <select id="month-filter" aria-label="按月份筛选">
          <option value="">全部月份</option>
        </select>
        <select id="period-filter" aria-label="按时段筛选">
          <option value="">全部时段</option>
        </select>
      </div>
      <p class="archive-meta" style="margin-bottom:0">月份与时段可以组合筛选；不符合命名规则的歌单会归入待分类。</p>
    </section>
    <section class="archive-panel">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
        <h2 style="margin:0">全部歌单</h2>
        <a id="smart-import-link" href="/archive/import/" hidden>智能导入</a>
      </div>
      <div id="list" aria-live="polite">档案加载中……</div>
    </section>
  </main>
  <script src="/js/config.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/archive.js?v=20261101-3"></script>
  <script>
    (async () => {
      const link = document.getElementById("smart-import-link");
      if (!link || typeof getCurrentUser !== "function") return;
      const user = await getCurrentUser();
      link.hidden = !(user && ["admin", "root"].includes(user.role));
    })();
  </script>
</body>
</html>
