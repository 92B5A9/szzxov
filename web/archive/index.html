<script>
  async function loadList() {
    const res = await fetch('/archive/archive.json');
    const data = await res.json();

    const list = document.getElementById('list');
    list.innerHTML = "";

    data.results.forEach(item => {
      const div = document.createElement('div');
      div.className = "glass-card";
      div.style.marginTop = "12px";
      div.innerHTML = `
        <strong>${item.title}</strong><br>
        ${item.author}<br>
        第 ${item.issue} 期<br>
        <span style="opacity:0.7;">${item.created_at}</span>
      `;
      list.appendChild(div);
    });
  }

  loadList();


  async function loadIssues() {
    const res = await fetch('/archive/archive.json');
    const data = await res.json();

    const filter = document.getElementById('filter');
    const issues = new Set();

    data.results.forEach(item => issues.add(item.issue));

    issues.forEach(issue => {
      const opt = document.createElement('option');
      opt.value = issue;
      opt.textContent = `第 ${issue} 期`;
      filter.appendChild(opt);
    });
  }

  loadIssues();


  document.getElementById('filter').addEventListener('change', async (e) => {
    const issue = e.target.value;

    const res = await fetch('/archive/archive.json');
    const data = await res.json();

    const list = document.getElementById('list');
    list.innerHTML = "";

    data.results
      .filter(item => !issue || item.issue == issue)
      .forEach(item => {
        const div = document.createElement('div');
        div.className = "glass-card";
        div.style.marginTop = "12px";
        div.innerHTML = `
          <strong>${item.title}</strong><br>
          ${item.author}<br>
          第 ${item.issue} 期<br>
          <span style="opacity:0.7;">${item.created_at}</span>
        `;
        list.appendChild(div);
      });
  });


  document.getElementById('search').addEventListener('input', async (e) => {
    const keyword = e.target.value.toLowerCase();

    const res = await fetch('/archive/archive.json');
    const data = await res.json();

    const list = document.getElementById('list');
    list.innerHTML = "";

    data.results
      .filter(item =>
        item.title.toLowerCase().includes(keyword) ||
        item.author.toLowerCase().includes(keyword)
      )
      .forEach(item => {
        const div = document.createElement('div');
        div.className = "glass-card";
        div.style.marginTop = "12px";
        div.innerHTML = `
          <strong>${item.title}</strong><br>
          ${item.author}<br>
          第 ${item.issue} 期<br>
          <span style="opacity:0.7;">${item.created_at}</span>
        `;
        list.appendChild(div);
      });
  });
</script>
