<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>身份验证丨苏州</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    /* 覆盖默认样式：无背景图，默认黑色/深色主题 */
    body {
      background-image: none !important;
      background-color: #0f0f14 !important; /* 深黑底色 */
      color: #f0f0f0 !important;
    }

    /* 适配深色下的毛玻璃卡片与输入框视觉 */
    .glass-card {
      background: rgba(30, 30, 45, 0.65) !important;
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }

    .input-glass {
      background: rgba(255, 255, 255, 0.08) !important;
      color: #ffffff !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
    }

    .input-glass::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .submit-btn {
      background: rgba(255, 255, 255, 0.18) !important;
      color: #ffffff !important;
      border: 1px solid rgba(255, 255, 255, 0.25) !important;
    }

    .submit-btn:hover {
      background: rgba(255, 255, 255, 0.3) !important;
    }
  </style>
</head>

<body class="dark-mode">

  <!-- 主体内容 -->
  <main style="padding: 40px 20px;">

    <div class="glass-card fade-pair">

      <h1 class="center-title" style="text-align: center; margin-top: 0; color: #ffffff;">身份验证</h1>

      <!-- 表单区域：包含三个输入框与一个确认按键 -->
      <form onsubmit="handleSubmit(event)">
        <!-- 输入框 1：账号 ID -->
        <label class="form-label" for="account-id">账号 ID</label>
        <input type="text" id="account-id" class="input-glass" placeholder="请输入账号 ID" required>

        <!-- 输入框 2：验证手机号 -->
        <label class="form-label" for="account-phone">验证手机号</label>
        <input type="tel" id="account-phone" class="input-glass" placeholder="请输入 11 位手机号码" pattern="[0-9]{11}" required>

        <!-- 输入框 3：验证密码 -->
        <label class="form-label" for="account-key">验证密码</label>
        <input type="password" id="account-key" class="input-glass" placeholder="请输入验证密码" required>

        <!-- 确认按键 -->
        <button type="submit" class="submit-btn">确 认</button>
      </form>

    </div>

  </main>

  <!-- 交互逻辑 + 渐显动画 -->
  <script>
    // 拦截提交逻辑：包含账号、手机号与密码的统一错误提示
    function handleSubmit(event) {
      event.preventDefault(); // 阻止表单默认提交刷新
      alert("账号或密码错误");
    }

    // 页面加载完毕后触发渐显动画
    window.onload = function() {
      const fadeElement = document.querySelector('.fade-pair');
      if (fadeElement) {
        fadeElement.classList.add('visible');
      }
    }
  </script>

</body>
</html>
