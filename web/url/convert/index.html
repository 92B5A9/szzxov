<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>身份验证</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body class="light-mode">



  <!-- 主体内容 -->
  <main style="padding: 20px;">

    <div class="glass-card fade-pair">

      <h1 class="center-title" style="text-align: center; margin-top: 0;">身份验证</h1>

      <!-- 表单区域：包含三个输入框与一个确认按键 -->
      <form onsubmit="handleSubmit(event)">
        <!-- 输入框 1：账号 ID -->
        <label class="form-label" for="account-id">账号 ID</label>
        <input type="text" id="account-id" class="input-glass" placeholder="请输入账号 ID" required>

        <!-- 输入框 2：验证手机号 -->
        <label class="form-label" for="account-phone">验证手机号</label>
        <input type="tel" id="account-phone" class="input-glass" placeholder="请输入 11 位手机号码" pattern="[0-9]{11}" required>

        <!-- 输入框 3：验证密码 -->
        <label class="form-label" for="account-key">验证密码</label>
        <input type="password" id="account-key" class="input-glass" placeholder="请输入验证密码" required>

        <!-- 确认按键 -->
        <button type="submit" class="submit-btn">确 认</button>
      </form>

    </div>

  </main>

  <!-- 交互逻辑 + 动画 + 深色模式 -->
  <script>
    // 拦截提交逻辑：无论输入什么内容，均弹窗提示“账号或密码错误”
    function handleSubmit(event) {
      event.preventDefault(); // 阻止表单默认提交刷新
      alert("账号或密码错误");
    }

    // 页面加载完毕后执行动画与主题检查
    window.onload = function() {
      const savedTheme = localStorage.getItem("theme");
      if (savedTheme === "dark") {
        document.body.classList.add("dark-mode");
      } else {
        document.body.classList.add("light-mode");
      }

      // 触发渐显动画
      const fadeElement = document.querySelector('.fade-pair');
      if (fadeElement) {
        fadeElement.classList.add('visible');
      }
    }
  </script>

</body>
</html>
