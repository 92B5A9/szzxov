<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#dfe7ef">
<title>Root 密码恢复丨苏州中学OV广播社</title>
<link rel="stylesheet" href="/style.css">
<style>
.recovery{max-width:600px;margin:28px auto;padding:0 16px}
.recovery label{display:block;margin:16px 0 6px}
.recovery input{display:block;width:100%}
.recovery button{width:100%;margin-top:20px}
.notice{font-size:14px;padding:12px;border-radius:12px;background:rgba(220,150,35,.12)}
#result{overflow-wrap:anywhere}
</style>
</head>
<body class="light-mode">
<div id="site-nav"></div>
<main class="recovery">
<section class="glass-card">
<h1>Root 密码恢复</h1>
<p>恢复现有的 Gaoeaten root 账号。此页面需要配合已部署的 Worker 恢复接口。</p>
<p class="notice">请勿将启动密钥写入网页代码。只在下方临时输入；重置完成后，建议立即轮换 BOOTSTRAP_SECRET 并移除临时恢复接口。</p>
<form id="recoveryForm">
<label for="secret">Bootstrap Secret</label>
<input class="input-glass" id="secret" type="password" autocomplete="off" required>
<label for="password">新密码（至少 12 位）</label>
<input class="input-glass" id="password" type="password" minlength="12" autocomplete="new-password" required>
<label for="confirm">确认新密码</label>
<input class="input-glass" id="confirm" type="password" minlength="12" autocomplete="new-password" required>
<button class="submit-btn" id="submit" type="submit">重置 Gaoeaten 密码</button>
</form>
<p id="result" role="status" aria-live="polite"></p>
<p><a href="/login/">返回登录页</a></p>
</section>
</main>
<script src="/js/config.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/navbar.js"></script>
<script src="/js/theme.js"></script>
<script>
(function(){
 const form=document.getElementById("recoveryForm");
 const button=document.getElementById("submit");
 const result=document.getElementById("result");
 form.addEventListener("submit",async function(event){
  event.preventDefault();
  const secret=document.getElementById("secret").value;
  const password=document.getElementById("password").value;
  const confirm=document.getElementById("confirm").value;
  if(password.length<12){result.textContent="新密码至少需要 12 位。";return;}
  if(password!==confirm){result.textContent="两次输入的密码不一致。";return;}
  button.disabled=true;button.textContent="正在重置…";result.textContent="";
  try{
   const {response,data}=await window.requestJSON("/api/setup/promote-root",{
    method:"POST",
    headers:{"X-Bootstrap-Secret":secret},
    body:JSON.stringify({password})
   });
   if(response.ok&&data&&data.ok){
    result.textContent="接口确认重置成功。请清空输入框并前往登录页验证。";
    form.reset();
   }else{
    result.textContent=(data&&data.message)||("重置失败（HTTP "+response.status+"）。");
   }
  }catch(e){result.textContent="无法连接 API。请检查网络、CORS 与 Worker 部署。";}
  finally{button.disabled=false;button.textContent="重置 Gaoeaten 密码";}
 });
})();
</script>
</body>
</html>
