<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>提交投稿</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body class="light-mode">

  <!-- 顶部横向导航条（全站统一） -->
  <div class="topbar">
    <a href="/">首页</a>
    <a href="/submit">投稿</a>
    <a href="/archive">往期</a>
    <a href="/help">帮助</a>
    <a href="/settings">设置</a>
    <a href="/url">友情链接</a>
  </div>

  <!-- 主体内容 -->
  <main class="home-layout">

    <div class="home-right">

      <section class="home-section fade-pair">
        <div class="glass-card">

          <h1>提交投稿</h1>

          <form id="submitForm" style="margin-top:20px;">

            <label class="form-label">歌曲名</label>
            <input type="text" name="title" class="submit-input input-glass" placeholder="请输入歌曲名">

            <label class="form-label">歌手</label>
            <input type="text" name="author" class="submit-input input-glass" placeholder="请输入歌手">

            <button type="submit" class="submit-btn">提交</button>

          </form>

          <p id="result"></p>

        </div>
      </section>

    </div>

  </main>

  <!-- 滚动淡入动画 -->
  <script>
    const sections = document.querySelectorAll('.fade-pair');

    function checkSections() {
      const trigger = window.innerHeight * 0.7;

      sections.forEach(sec => {
        const rect = sec.getBoundingClientRect();
        if (rect.top < trigger) {
          sec.classList.add('visible');
        }
      });
    }

    document.querySelector('.home-right').addEventListener('scroll', checkSections);
    window.onload = checkSections;
  </script>

  <!-- 投稿提交逻辑（后端待接入） -->
  <script>
    document.getElementById('submitForm').addEventListener('submit', (e) => {
      e.preventDefault();
      document.getElementById('result').innerText = "投稿已提交（后端待接入）";
    });
  </script>

  <!-- 深色模式 -->
  <script>
    function setLightMode() {
      document.body.classList.remove("dark-mode");
      document.body.classList.add("light-mode");
      localStorage.setItem("theme", "light");
    }

    function setDarkMode() {
      document.body.classList.remove("light-mode");
      document.body.classList.add("dark-mode");
      localStorage.setItem("theme", "dark");
    }

    window.onload = function() {
      const savedTheme = localStorage.getItem("theme");
      if (savedTheme === "dark") {
        document.body.classList.add("dark-mode");
      } else {
        document.body.classList.add("light-mode");
      }
    }
  </script>

</body>
</html>
