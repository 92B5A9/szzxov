<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>友情链接</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body class="light-mode">

  <!-- 顶部汉堡菜单 -->
  <div class="topbar">
    <div class="hamburger" onclick="openMenu()" id="hamburger">
      <div></div><div></div><div></div>
    </div>
  </div>

  <!-- 侧边栏 -->
  <div class="sidebar" id="sidebar">
    <a href="/">首页</a>
    <a href="/help">帮助</a>
    <a href="/submit">投稿</a>
    <a href="/archive">往期</a>
    <a href="/settings">设置</a>
    <a href="/url">友情链接</a>
  </div>

  <div class="overlay" id="overlay" onclick="closeMenu()"></div>

  <!-- 主体内容 -->
  <main class="friend-links fade-pair">

    <h1 class="center-title">友情链接</h1>

    <!-- 你已有的链接 -->
    <a class="friend-card" href="https://你的原链接.com" target="_blank">
      原有链接名称
    </a>

    <!-- 新增链接示例 -->
    <a class="friend-card" href="https://example.com" target="_blank">
      Example 网站
    </a>

    <a class="friend-card" href="https://github.com" target="_blank">
      GitHub
    </a>

    <a class="friend-card" href="https://cloudflare.com" target="_blank">
      Cloudflare
    </a>

    <!-- 继续添加即可 -->
    <!--
    <a class="friend-card" href="https://你的新链接.com" target="_blank">
      新链接名称
    </a>
    -->

  </main>

  <!-- 全站通用 JS（主题切换 + 菜单 + 动画） -->
  <script>
    function openMenu() {
      document.getElementById("sidebar").style.left = "0";
      document.getElementById("overlay").style.display = "block";
      document.getElementById("hamburger").classList.add("active");
    }

    function closeMenu() {
      document.getElementById("sidebar").style.left = "-300px";
      document.getElementById("overlay").style.display = "none";
      document.getElementById("hamburger").classList.remove("active");
    }

    function setLightMode() {
      document.body.classList.remove("dark-mode");
      document.body.classList.add("light-mode");
      localStorage.setItem("theme", "light");
    }

    function setDarkMode() {
      document.body.classList.remove("light-mode");
      document.body.classList.add("dark-mode");
      localStorage.setItem("theme", "dark");
    }

    window.onload = function() {
      const savedTheme = localStorage.getItem("theme");
      if (savedTheme === "dark") {
        document.body.classList.add("dark-mode");
      } else {
        document.body.classList.add("light-mode");
      }

      // 淡入动画
      document.querySelector('.fade-pair').classList.add('visible');
    }
  </script>

</body>
</html>
