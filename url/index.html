<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="/style.css">
</head>

<body class="light-mode">

  <!-- 顶部横向导航条（全站统一） -->
  <div class="topbar">
    <a href="/">首页</a>
    <a href="/submit">投稿</a>
    <a href="/archive">往期</a>
    <a href="/help">帮助</a>
    <a href="/settings">设置</a>
    <a href="/url">友情链接</a>
  </div>

  <!-- 主体内容（不使用滑动，不使用 home-right，不使用 home-section） -->
  <main style="padding: 20px;">

    <div class="glass-card fade-pair">

      <h1 class="center-title">友情链接</h1>

      <!-- 你已有的链接 -->
      <a class="friend-card" href="https://szzxshumei.com" target="_blank">
        苏州中学树莓社
      </a>

      <a class="friend-card" href="https://game.ion-storm.vip" target="_blank">
        离子风暴•化学牌
      </a>

      <!-- 继续添加即可 -->
      <!--
      <a class="friend-card" href="https://你的新链接.com" target="_blank">
        新链接名称
      </a>
      -->

    </div>

  </main>

  <!-- 淡入动画 -->
  <script>
    window.onload = function() {
      const savedTheme = localStorage.getItem("theme");
      if (savedTheme === "dark") {
        document.body.classList.add("dark-mode");
      } else {
        document.body.classList.add("light-mode");
      }

      document.querySelector('.fade-pair').classList.add('visible');
    }
  </script>

</body>
