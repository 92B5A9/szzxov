<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>友情链接</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body class="light-mode">

  <!-- 顶部横向导航条（全站统一） -->
  <div class="topbar">
    <a href="/">首页</a>
    <a href="/submit">投稿</a>
    <a href="/archive">往期</a>
    <a href="/help">帮助</a>
    <a href="/settings">设置</a>
    <a href="/url">友情链接</a>
  </div>

  <!-- 主体内容 -->
  <main class="home-layout">

    <div class="home-right">

      <section class="home-section fade-pair">
        <div class="glass-card">

          <h1 class="center-title">友情链接</h1>

          <!-- 你已有的链接 -->
          <a class="friend-card" href="https://szzxshumei.com" target="_blank">
            苏州中学树莓社
          </a>

          <a class="friend-card" href="https://game.ion-storm.vip" target="_blank">
            离子风暴•化学牌
          </a>
          
          <a class="friend-card" href="https://szzx1000.cn" target="_blank">
            江苏省苏州中学
          </a>

        </div>
      </section>

    </div>

  </main>

  <!-- 滚动淡入动画 -->
  <script>
    const sections = document.querySelectorAll('.fade-pair');

    function checkSections() {
      const trigger = window.innerHeight * 0.7;

      sections.forEach(sec => {
        const rect = sec.getBoundingClientRect();
        if (rect.top < trigger) {
          sec.classList.add('visible');
        }
      });
    }

    document.querySelector('.home-right').addEventListener('scroll', checkSections);
    window.onload = checkSections;
  </script>

  <!-- 深色模式 -->
  <script>
    function setLightMode() {
      document.body.classList.remove("dark-mode");
      document.body.classList.add("light-mode");
      localStorage.setItem("theme", "light");
    }

    function setDarkMode() {
      document.body.classList.remove("light-mode");
      document.body.classList.add("dark-mode");
      localStorage.setItem("theme", "dark");
    }

    window.onload = function() {
      const savedTheme = localStorage.getItem("theme");
      if (savedTheme === "dark") {
        document.body.classList.add("dark-mode");
      } else {
        document.body.classList.add("light-mode");
      }
    }
  </script>

</body>
</html>
