<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>友情链接</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body class="light-mode">

  <!-- 顶部横向导航条 -->
  <div class="topbar">
    <a href="/">首页</a>
    <a href="/submit">投稿</a>
    <a href="/archive">往期</a>
    <a href="/help">帮助</a>
    <a href="/settings">设置</a>
    <a href="/url">友情链接</a>
  </div>

  <!-- 主体内容 -->
  <main style="padding: 20px;">

    <div class="glass-card fade-pair">

      <h1 class="center-title">友情链接</h1>

      <!-- 友情链接列表 -->
      <div class="friend-list">

     		<a class="friend-card" href="https://szzxshumei.com" target="_blank">
  			<img class="favicon" 
        src="https://icons.duckduckgo.com/ip3/szzxshumei.com.ico">
 			  <span>苏州中学树莓社</span>
				</a>

				<a class="friend-card" href="https://game.ion-storm.vip" target="_blank">
			  <img class="favicon" 
   	    src="https://icons.duckduckgo.com/ip3/game.ion-storm.vip.ico">
 			  <span>离子风暴·化学牌</span>
				</a>

				<a class="friend-card" href="https://szzx1000.cn" target="_blank">
			  <img class="favicon" 
   	    src="https://icons.duckduckgo.com/ip3/szzx1000.cn.ico">
 			  <span>江苏省苏州中学</span>
				</a>

        <!-- 新增链接示例 -->
        <!--
        <a class="friend-card" href="https://你的链接.com" target="_blank">
          <img class="favicon" src="https://你的链接.com/favicon.ico"
               onerror="this.src='https://www.google.com/s2/favicons?domain=你的链接.com';">
          <span>你的名称</span>
        </a>
        -->

      </div>

    </div>

  </main>

  <!-- 动画 + 深色模式 -->
  <script>
    window.onload = function() {
      const savedTheme = localStorage.getItem("theme");
      if (savedTheme === "dark") {
        document.body.classList.add("dark-mode");
      } else {
        document.body.classList.add("light-mode");
      }

      document.querySelector('.fade-pair').classList.add('visible');
    }
  </script>

</body>
</html>
