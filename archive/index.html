<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>往期投稿展示</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body class="light-mode">

  <!-- 顶部横向导航条（与首页一致） -->
  <div class="topbar">
    <a href="/">首页</a>
    <a href="/submit">投稿</a>
    <a href="/archive">往期</a>
    <a href="/help">帮助</a>
    <a href="/settings">设置</a>
    <a href="/url">友情链接</a>
  </div>

  <!-- 主体内容 -->
  <main class="home-layout">

    <div class="home-right">

      <section class="home-section fade-pair">
        <div class="glass-card">
          <h1>往期投稿展示</h1>

          <input type="text" id="search" placeholder="搜索歌曲名或作者" class="input-glass">
          <select id="filter" class="input-glass">
            <option value="">全部期数</option>
          </select>

          <div id="list" class="glass-card" style="margin-top:20px;">
            投稿列表加载中（后端待接入）
          </div>

        </div>
      </section>

    </div>

  </main>

  <!-- 滚动淡入动画 -->
  <script>
    const sections = document.querySelectorAll('.fade-pair');

    function checkSections() {
      const trigger = window.innerHeight * 0.7;

      sections.forEach(sec => {
        const rect = sec.getBoundingClientRect();
        if (rect.top < trigger) {
          sec.classList.add('visible');
        }
      });
    }

    document.querySelector('.home-right').addEventListener('scroll', checkSections);
    window.onload = checkSections;
  </script>

  <!-- 深色模式 -->
  <script>
    function setLightMode() {
      document.body.classList.remove("dark-mode");
      document.body.classList.add("light-mode");
      localStorage.setItem("theme", "light");
    }

    function setDarkMode() {
      document.body.classList.remove("light-mode");
      document.body.classList.add("dark-mode");
      localStorage.setItem("theme", "dark");
    }

    window.onload = function() {
      const savedTheme = localStorage.getItem("theme");
      if (savedTheme === "dark") {
        document.body.classList.add("dark-mode");
      } else {
        document.body.classList.add("light-mode");
      }
    }
  </script>

</body>
</html>
