<!DOCTYPE html>
<html lang="zh-CN">
  <link rel="stylesheet" href="/style.css">
<head>
  <meta charset="UTF-8">
</nav>
  <title>往期投稿展示</title>
</head>
<body>
  <!-- 顶部汉堡菜单 -->
<div class="topbar">
  <div class="hamburger" onclick="openMenu()">
    <div></div>
    <div></div>
    <div></div>
  </div>
</div>
<!-- 左侧滑出菜单栏 -->
<div class="sidebar" id="sidebar">
  <a href="/">首页</a>
  <a href="/help">帮助</a>
  <a href="/submit">投稿</a>
  <a href="/archive">往期</a>
</div>

<!-- 点击遮罩层关闭菜单 -->
<div class="overlay" id="overlay" onclick="closeMenu()"></div>

  <h1>往期投稿展示</h1>

  <input type="text" id="search" placeholder="搜索歌曲名或作者">
  <select id="filter">
    <option value="">全部期数</option>
    <!-- 期数选项之后由后端填充 -->
  </select>

  <div id="list">
    <!-- 投稿列表（后端接入前先留空） -->
  </div>

  <script>
    // 之后接入 /api/list
    document.getElementById('list').innerText = "投稿列表加载中（后端待接入）";
  </script>
  <script>
  function openMenu() {
    document.getElementById("sidebar").style.left = "0";
    document.getElementById("overlay").style.display = "block";
  }

  function closeMenu() {
    document.getElementById("sidebar").style.left = "-300px"; /* 与宽度一致 */
    document.getElementById("overlay").style.display = "none";
  }
</script>

</body>
</html>
