<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>往期投稿展示</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body class="light-mode">

  <!-- 顶部横向导航条（全站统一） -->
  <div class="topbar">
    <a href="/">首页</a>
    <a href="/submit">投稿</a>
    <a href="/archive">往期</a>
    <a href="/help">帮助</a>
    <a href="/settings">设置</a>
    <a href="/url">友情链接</a>
  </div>

  <!-- 主体内容（正常排版，无滑动动画） -->
  <main style="padding: 20px;">

    <div class="glass-card">

      <h1>往期投稿展示</h1>

      <input type="text" id="search" placeholder="搜索歌曲名或作者" class="input-glass">

      <select id="filter" class="input-glass" style="margin-top: 12px;">
        <option value="">全部期数</option>
      </select>

      <div id="list" class="glass-card" style="margin-top:20px;">
        投稿列表加载中（后端待接入）
        <script>
async function loadList() {
  const res = await fetch('/api/archive');
  const data = await res.json();

  const list = document.getElementById('list');
  list.innerHTML = "";

  data.results.forEach(item => {
    const div = document.createElement('div');
    div.className = "glass-card";
    div.style.marginTop = "12px";
    div.innerHTML = `
      <strong>${item.title}</strong><br>
      ${item.author}<br>
      第 ${item.issue} 期<br>
      <span style="opacity:0.7;">${item.created_at}</span>
    `;
    list.appendChild(div);
  });
}

loadList();
</script>

      </div>

    </div>

  </main>

  <!-- 深色模式 -->
  <script>
    function setLightMode() {
      document.body.classList.remove("dark-mode");
      document.body.classList.add("light-mode");
      localStorage.setItem("theme", "light");
    }

    function setDarkMode() {
      document.body.classList.remove("light-mode");
      document.body.classList.add("dark-mode");
      localStorage.setItem("theme", "dark");
    }

    window.onload = function() {
      const savedTheme = localStorage.getItem("theme");
      if (savedTheme === "dark") {
        document.body.classList.add("dark-mode");
      } else {
        document.body.classList.add("light-mode");
      }
    }
  </script>

</body>
</html>
