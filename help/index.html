<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>投稿帮助</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body class="light-mode">

  <!-- 顶部横向导航条（与首页一致） -->
  <div class="topbar">
    <a href="/">首页</a>
    <a href="/submit">投稿</a>
    <a href="/archive">往期</a>
    <a href="/help">帮助</a>
    <a href="/settings">设置</a>
    <a href="/url">友情链接</a>
  </div>

  <!-- 主体内容 -->
  <main class="home-layout">

    <div class="home-right">

      <section class="home-section fade-pair">
        <div class="glass-card">
          <h1>投稿帮助</h1>

          <p>
            在这里你可以查看投稿规则、格式要求、注意事项等内容。
            所有投稿将由广播社成员进行审核并安排播出。
          </p>

          <p style="margin-top:20px;">
            如果你有任何疑问，可以通过设置页联系我们。
          </p>

        </div>
      </section>

    </div>

  </main>

  <!-- 滚动淡入动画 -->
  <script>
    const sections = document.querySelectorAll('.fade-pair');

    function checkSections() {
      const trigger = window.innerHeight * 0.7;

      sections.forEach(sec => {
        const rect = sec.getBoundingClientRect();
        if (rect.top < trigger) {
          sec.classList.add('visible');
        }
      });
    }

    document.querySelector('.home-right').addEventListener('scroll', checkSections);
    window.onload = checkSections;
  </script>

  <!-- 深色模式 -->
  <script>
    function setLightMode() {
      document.body.classList.remove("dark-mode");
      document.body.classList.add("light-mode");
      localStorage.setItem("theme", "light");
    }

    function setDarkMode() {
      document.body.classList.remove("light-mode");
      document.body.classList.add("dark-mode");
      localStorage.setItem("theme", "dark");
    }

    window.onload = function() {
      const savedTheme = localStorage.getItem("theme");
      if (savedTheme === "dark") {
        document.body.classList.add("dark-mode");
      } else {
        document.body.classList.add("light-mode");
      }
    }
  </script>

</body>
</html>
